services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerlight
      POSTGRES_USER: ledgerlight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlight"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ledgerlight:${POSTGRES_PASSWORD:-change-me}@db:5432/ledgerlight
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ledgerlight:${POSTGRES_PASSWORD:-change-me}@db:5432/ledgerlight
    command: ["python", "-m", "app.worker"]
    volumes: [exports:/srv/exports]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
  exports:
